# Build the gallery from photos/ and publish it to GitHub Pages (faiz.pics).
# Runs on every push to main, or by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true' # Chrome is only for the local e2e checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reuse the resized photos from the last build; only new or changed photos are processed.
      - uses: actions/cache@v4
        with:
          path: public/photos
          key: photos-${{ hashFiles('photos/**', 'scripts/prepare-photos.mjs', 'src/analyze.js', 'src/edits.js') }}
          restore-keys: photos-
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
