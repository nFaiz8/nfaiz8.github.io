<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Faiz · photographs</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="stage" tabindex="0" aria-label="Gallery map. Use the arrow keys or WASD to walk, E to open a photo, G for all photos." role="application"></div>
    <header class="hud">
      <span class="hud-name" id="hud-name"></span>
      <span class="hud-tools">
        <span class="hud-here" id="hud-here" hidden></span>
        <button class="hud-btn" id="emote-btn" type="button" title="Emotes (1–5)" aria-expanded="false" hidden>[☺]</button>
        <button class="hud-btn" id="chat-btn" type="button" title="Chat (T)" hidden>[T]<span class="long"> chat</span></button>
        <button class="hud-btn" id="name-btn" type="button" title="Your name (N)" aria-expanded="false" hidden>[N]<span class="long"> name</span></button>
        <button class="hud-btn" id="map-btn" type="button" title="Map (M)">[M]<span class="long"> map</span></button>
        <button class="hud-btn" id="renderer-btn" type="button" title="Switch renderer (R)"></button>
      </span>
    </header>
    <div class="emote-bar" id="emote-bar" hidden></div>
    <form class="chat-form" id="chat-form" hidden>
      <input id="chat-input" maxlength="80" autocomplete="off" spellcheck="false" aria-label="Say something" placeholder="say something…" />
      <button class="vbtn" type="submit">send</button>
      <span class="chat-msg" id="chat-msg" role="status"></span>
    </form>
    <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-label="Chat"></div>
    <form class="name-form" id="name-form" hidden>
      <label for="name-input">your name</label>
      <input id="name-input" maxlength="12" autocomplete="nickname" spellcheck="false" />
      <button class="vbtn" type="submit">save</button>
      <span class="name-msg" id="name-msg" role="status"></span>
    </form>
    <div class="caption" id="caption" aria-live="polite"></div>
    <div class="note" id="note" role="status"></div>
    <pre class="debug" id="debug" hidden></pre>
    <nav class="sr-only" id="photo-links" aria-label="All photographs"></nav>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
